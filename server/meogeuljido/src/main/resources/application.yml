spring:
  application:
    name: meogeuljido

  jackson:
    time-zone: Asia/Seoul

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:meogeuljido}
    username: ${POSTGRES_USER:meogeuljido}
    password: ${POSTGRES_PASSWORD:dev_local_only_password}

  jpa:
    hibernate:
      ddl-auto: validate # 스키마는 Flyway 마이그레이션으로만 관리 (db-schema.md)
    open-in-view: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:dev_local_only_password}

management:
  health:
    mail:
      enabled: false

jwt:
  secret: ${JWT_SECRET}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
