<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>먹을지도 Admin · 식당 상세/검수 화면 목업</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: '#FF6000', ink: '#222222', muted: '#A3A3A3', muted2: '#737373',
          hairline: '#E5E5E5', promo: '#FCF4EE', navborder: '#D4D4D4',
        },
        fontFamily: { sans: ['Pretendard Variable', 'Pretendard', '-apple-system', 'system-ui', 'sans-serif'] },
      },
    },
  };
</script>
<style>
  html, body { height: 100%; }
  body { font-family: 'Pretendard Variable', 'Pretendard', -apple-system, system-ui, sans-serif; }
  .facility-chip[aria-pressed="true"] { background-color: #FF6000; color: #fff; border-color: #FF6000; }
</style>
</head>
<body class="bg-neutral-50">
<div class="min-h-screen flex">

  <!-- ============ 사이드바 ============ -->
  <aside class="w-60 shrink-0 bg-white border-r border-hairline flex flex-col">
    <div class="px-5 py-5 border-b border-hairline">
      <a href="admin-restaurants.html" class="flex items-center gap-1.5 text-ink font-extrabold text-[17px]">
        <span class="text-primary">🍚</span> 먹을지도 <span class="text-muted2 font-semibold text-[13px]">Admin</span>
      </a>
    </div>
    <nav class="flex-1 px-3 py-4 flex flex-col gap-1 text-[14px] font-semibold">
      <a href="admin-restaurants.html" class="flex items-center gap-2.5 rounded-xl px-3 py-2.5 bg-promo text-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1-5h16l1 5M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9M9 21v-6h6v6"/></svg>
        식당 관리
      </a>
      <a href="admin-reviews.html" class="flex items-center gap-2.5 rounded-xl px-3 py-2.5 text-muted2 hover:bg-neutral-50">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        리뷰 모니터링
      </a>
      <a href="admin-logs.html" class="flex items-center gap-2.5 rounded-xl px-3 py-2.5 text-muted2 hover:bg-neutral-50">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        활동 로그
      </a>
      <a href="admin-notices.html" class="flex items-center gap-2.5 rounded-xl px-3 py-2.5 text-muted2 hover:bg-neutral-50">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-7-4 18-6-8-8-3z"/></svg>
        공지·FAQ 관리
      </a>
      <a href="admin-inquiries.html" class="flex items-center gap-2.5 rounded-xl px-3 py-2.5 text-muted2 hover:bg-neutral-50">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        1:1문의 관리
      </a>
    </nav>
    <div class="px-3 py-4 border-t border-hairline">
      <a href="index.html" class="flex items-center gap-2 rounded-xl px-3 py-2.5 text-[13px] font-semibold text-muted2 hover:text-ink">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        사용자 화면으로
      </a>
    </div>
  </aside>

  <!-- ============ 컨텐츠 ============ -->
  <div class="flex-1 min-w-0 flex flex-col">
    <header class="h-16 shrink-0 border-b border-hairline flex items-center justify-between px-8 bg-white">
      <h1 class="text-[18px] font-bold text-ink">식당 상세/검수</h1>
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-full bg-promo flex items-center justify-center text-[12px] font-bold text-primary">관</div>
        <span class="text-[13px] font-semibold text-ink">관리자</span>
        <a href="login.html" class="text-[12px] text-muted2 font-medium ml-2">로그아웃</a>
      </div>
    </header>

    <main class="flex-1 overflow-y-auto px-8 py-6">
      <div class="max-w-6xl mx-auto">
        <a href="admin-restaurants.html" class="inline-flex items-center gap-1.5 text-[13px] font-semibold text-muted2 hover:text-ink mb-5">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
          목록으로
        </a>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

          <!-- 좌측: 기본 정보 -->
          <div class="lg:col-span-2 flex flex-col gap-5">
            <div class="bg-white rounded-2xl border border-hairline p-5">
              <h2 class="text-[14px] font-bold text-ink mb-3">매장·메뉴 사진</h2>
              <div class="grid grid-cols-4 gap-2">
                <div class="aspect-square rounded-xl bg-neutral-200"></div>
                <div class="aspect-square rounded-xl bg-neutral-200"></div>
                <div class="aspect-square rounded-xl bg-neutral-200"></div>
                <div class="aspect-square rounded-xl bg-neutral-200"></div>
              </div>
            </div>

            <div class="bg-white rounded-2xl border border-hairline p-5 flex flex-col gap-4">
              <h2 class="text-[14px] font-bold text-ink">기본 정보</h2>

              <div>
                <label class="text-[12px] font-semibold text-muted2">상호명</label>
                <input type="text" value="혼밥각 국밥집" class="mt-1 w-full rounded-xl border border-hairline px-3.5 py-2.5 text-[14px] font-medium text-ink outline-none focus:border-primary" />
              </div>

              <div class="grid grid-cols-2 gap-4">
                <div>
                  <label class="text-[12px] font-semibold text-muted2">카테고리</label>
                  <select class="mt-1 w-full rounded-xl border border-hairline px-3.5 py-2.5 text-[14px] text-ink outline-none focus:border-primary">
                    <option selected>한식 · 국밥</option>
                    <option>중식</option>
                    <option>일식</option>
                  </select>
                </div>
                <div>
                  <label class="text-[12px] font-semibold text-muted2">영업시간</label>
                  <input type="text" value="매일 24시간" class="mt-1 w-full rounded-xl border border-hairline px-3.5 py-2.5 text-[14px] text-ink outline-none focus:border-primary" />
                </div>
              </div>

              <div>
                <label class="text-[12px] font-semibold text-muted2">위치</label>
                <input type="text" value="서울 마포구 어울길 12-3" class="mt-1 w-full rounded-xl border border-hairline px-3.5 py-2.5 text-[14px] text-ink outline-none focus:border-primary" />
              </div>

              <div>
                <label class="text-[12px] font-semibold text-muted2">편의시설</label>
                <div class="mt-1.5 flex flex-wrap gap-2">
                  <button type="button" class="facility-chip rounded-full border border-navborder px-3 py-1.5 text-[12px] font-semibold text-ink" aria-pressed="true">24시간</button>
                  <button type="button" class="facility-chip rounded-full border border-navborder px-3 py-1.5 text-[12px] font-semibold text-ink" aria-pressed="false">주차 가능</button>
                  <button type="button" class="facility-chip rounded-full border border-navborder px-3 py-1.5 text-[12px] font-semibold text-ink" aria-pressed="false">포장 가능</button>
                  <button type="button" class="facility-chip rounded-full border border-navborder px-3 py-1.5 text-[12px] font-semibold text-ink" aria-pressed="false">반려동물 동반</button>
                  <button type="button" class="facility-chip rounded-full border border-navborder px-3 py-1.5 text-[12px] font-semibold text-ink" aria-pressed="false">단체석</button>
                </div>
              </div>
            </div>
          </div>

          <!-- 우측: 등록자 정보 / 상태 / 로그 -->
          <div class="flex flex-col gap-5">
            <div class="bg-white rounded-2xl border border-hairline p-5">
              <h2 class="text-[13px] font-bold text-muted2">현재 상태</h2>
              <span class="mt-2 inline-flex rounded-full bg-amber-100 text-amber-700 text-[12px] font-bold px-3 py-1.5">승인대기</span>
            </div>

            <div class="bg-white rounded-2xl border border-hairline p-5">
              <h2 class="text-[13px] font-bold text-muted2 mb-3">등록자 정보</h2>
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-promo flex items-center justify-center text-[14px] font-bold text-primary">혼</div>
                <div>
                  <p class="text-[14px] font-bold text-ink">혼밥러버</p>
                  <p class="text-[12px] text-muted2">food_lover@meogeuljido.com</p>
                </div>
              </div>
              <p class="text-[12px] text-muted2 mt-3">등록일 2026.08.09</p>
            </div>

            <div class="bg-white rounded-2xl border border-hairline p-5">
              <h2 class="text-[13px] font-bold text-muted2 mb-3">최근 활동 로그</h2>
              <ul class="flex flex-col gap-2.5 text-[12px] text-ink">
                <li class="flex justify-between gap-2"><span>식당 신규 등록</span><span class="text-muted2 shrink-0">08.09 14:22</span></li>
                <li class="flex justify-between gap-2"><span>매장 사진 4장 업로드</span><span class="text-muted2 shrink-0">08.09 14:23</span></li>
                <li class="flex justify-between gap-2"><span>중복등록 검증 통과</span><span class="text-muted2 shrink-0">08.09 14:23</span></li>
              </ul>
            </div>

            <div class="bg-white rounded-2xl border border-hairline p-5 flex flex-col gap-2.5">
              <button class="w-full rounded-xl bg-primary text-white text-[14px] font-bold py-2.5">승인</button>
              <button class="w-full rounded-xl border border-hairline text-ink text-[14px] font-bold py-2.5">반려</button>
              <button class="w-full rounded-xl border border-red-200 text-red-600 text-[14px] font-bold py-2.5">삭제</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script>
  document.querySelectorAll('.facility-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      const pressed = btn.getAttribute('aria-pressed') === 'true';
      btn.setAttribute('aria-pressed', String(!pressed));
    });
  });
</script>
</body>
</html>
