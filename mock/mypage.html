          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-1.5">

              <span class="shrink-0 rounded-full bg-white text-primary text-[10px] font-bold px-1.5 py-0.5">USER</span>
            </div>
            <p class="text-[12px] text-muted2 mt-0.5 truncate">food_lover@meogeuljido.com</p>
          </div>
          <button type="button" id="edit-profile-btn" class="shrink-0 rounded-full border border-primary/30 text-primary text-[12px] font-bold px-3 py-1.5 bg-white">
            프로필 수정
          </button>
        </div>
      </div>

      <!-- 활동 요약 -->

        <a href="my-reviews.html" class="rounded-2xl border border-hairline py-3 lg:py-4 text-center hover:border-primary/40">
          <p class="text-[17px] font-bold text-ink">12</p>
          <p class="text-[11px] text-muted2 mt-0.5 font-semibold">내가 쓴 리뷰</p>
        </a>
        <a href="bookmarks.html" class="rounded-2xl border border-hairline py-3 lg:py-4 text-center hover:border-primary/40">
          <p class="text-[17px] font-bold text-ink">3</p>
          <p class="text-[11px] text-muted2 mt-0.5 font-semibold">즐겨찾기</p>
        </a>
        <a href="my-restaurants.html" class="rounded-2xl border border-hairline py-3 lg:py-4 text-center hover:border-primary/40">

        </a>
      </div>

      <div class="h-2 bg-neutral-100 mt-5 lg:hidden"></div>
      <div class="hidden lg:block h-px bg-hairline mt-6"></div>

      <!-- 메뉴 리스트 -->

          <span class="text-[14px] font-medium text-ink">공지사항</span>

        <a href="inquiries.html" class="flex items-center justify-between py-3.5 border-b border-hairline">

        </a>
        <div class="flex items-center justify-between py-3.5">

          <span class="text-[13px] text-muted2">v1.0.0</span>

      <div class="h-2 bg-neutral-100 lg:hidden"></div>

      <div class="px-5 lg:px-0 py-2 flex items-center justify-between">

  <!-- ================= 하단 네비게이션: 모바일 전용 ================= -->

      <span class="text-[11px] font-semibold">지도 홈</span>
    </a>
    <a href="bookmarks.html" class="flex-1 flex flex-col items-center justify-center gap-0.5 text-muted">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      <span class="text-[11px] font-semibold">즐겨찾기</span>
    </a>
    <a href="mypage.html" class="flex-1 flex flex-col items-center justify-center gap-0.5 text-primary">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>

  <!-- ============ 프로필 수정 모달: PATCH /api/users/me 대응 (닉네임만 수정, 이메일/비밀번호는 별도 흐름) ============ -->
  <div id="edit-profile-modal" class="hidden fixed inset-0 z-50 items-end lg:items-center justify-center">
    <div id="edit-profile-backdrop" class="absolute inset-0 bg-ink/40"></div>
    <div role="dialog" aria-modal="true" aria-labelledby="edit-profile-title" class="relative w-full lg:w-[400px] lg:rounded-3xl rounded-t-3xl bg-white p-5 pb-7 lg:pb-6 shadow-sheet">
      <div class="flex items-center justify-between">
        <h2 id="edit-profile-title" class="text-[16px] font-bold text-ink">프로필 수정</h2>
        <button type="button" id="edit-profile-close" aria-label="닫기" class="w-8 h-8 rounded-full flex items-center justify-center text-muted2">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="mt-4">
        <label class="text-[13px] font-semibold text-ink">닉네임</label>
        <input id="edit-nickname-input" type="text" maxlength="20" class="mt-1.5 w-full rounded-xl border border-hairline px-3.5 py-3 text-[14px] outline-none focus:border-primary" />
        <p id="edit-nickname-error" class="hidden text-[12px] font-semibold text-red-500 mt-1.5">닉네임을 입력해주세요</p>
      </div>

      <div class="flex gap-2 mt-5">
        <button type="button" id="edit-profile-cancel" class="flex-1 rounded-xl border border-hairline text-ink text-[14px] font-bold py-3">취소</button>
        <button type="button" id="edit-profile-save" class="flex-1 rounded-xl bg-primary text-white text-[14px] font-bold py-3">저장</button>
      </div>
    </div>
  </div>
</div>

<script>
  // 프로필 수정 모달: 마이페이지 카드에 표시된 닉네임을 그대로 불러와 편집하고, 저장 시 화면에 즉시 반영한다.
  const editProfileModal = document.getElementById('edit-profile-modal');
  const editNicknameInput = document.getElementById('edit-nickname-input');
  const editNicknameError = document.getElementById('edit-nickname-error');
  const profileNicknameEl = document.getElementById('profile-nickname');
  const profileAvatarEl = document.getElementById('profile-avatar');

  function openEditProfileModal() {
    editNicknameInput.value = profileNicknameEl.textContent.trim();
    editNicknameError.classList.add('hidden');
    editProfileModal.classList.remove('hidden');
    editProfileModal.classList.add('flex');
  }
  function closeEditProfileModal() {
    editProfileModal.classList.add('hidden');
    editProfileModal.classList.remove('flex');
  }

  document.getElementById('edit-profile-btn').addEventListener('click', openEditProfileModal);
  document.getElementById('edit-profile-close').addEventListener('click', closeEditProfileModal);
  document.getElementById('edit-profile-cancel').addEventListener('click', closeEditProfileModal);
  document.getElementById('edit-profile-backdrop').addEventListener('click', closeEditProfileModal);
  document.getElementById('edit-profile-save').addEventListener('click', () => {
    const value = editNicknameInput.value.trim();
    if (value.length === 0) {
      editNicknameError.classList.remove('hidden');
      return;
    }
    profileNicknameEl.textContent = value;
    profileAvatarEl.textContent = value.charAt(0);
    closeEditProfileModal();
  });
</script>
</body>
