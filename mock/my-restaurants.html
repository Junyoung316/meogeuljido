<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>먹을지도 · 등록한 식당 화면 목업 (반응형)</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: '#FF6000', ink: '#222222', muted: '#A3A3A3', muted2: '#737373',
          hairline: '#E5E5E5', promo: '#FCF4EE', navborder: '#D4D4D4',
        },
        fontFamily: { sans: ['Pretendard Variable', 'Pretendard', '-apple-system', 'system-ui', 'sans-serif'] },
        boxShadow: { floating: '0 4px 16px rgba(34, 34, 34, 0.12)' },
      },
    },
  };
</script>
<style>
  html, body { height: 100%; }
  body { font-family: 'Pretendard Variable', 'Pretendard', -apple-system, system-ui, sans-serif; }
</style>
</head>
<body class="bg-white">
<div class="relative min-h-screen w-full bg-white flex flex-col">

  <!-- ============ 모바일 전용 헤더 (<1024px) ============ -->
  <header class="lg:hidden shrink-0 flex items-center gap-3 px-4 py-3.5 border-b border-hairline">
    <a href="mypage.html" aria-label="뒤로가기" class="w-8 h-8 flex items-center justify-center -ml-1">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 class="text-[16px] font-bold text-ink">등록한 식당</h1>
  </header>

  <!-- ============ 데스크톱 전용 사이트 헤더 (≥1024px) ============ -->
  <header class="hidden lg:flex shrink-0 h-16 border-b border-hairline items-center justify-between px-6">
    <div class="flex items-center gap-10">
      <a href="index.html" class="flex items-center gap-1.5 text-ink font-extrabold text-[18px]">
        <span class="text-primary">🍚</span> 먹을지도
      </a>
      <nav class="flex items-center gap-6 text-[14px] font-semibold">
        <a href="index.html" class="flex items-center gap-1.5 text-muted2 hover:text-ink">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
          지도 홈
        </a>
        <a href="bookmarks.html" class="flex items-center gap-1.5 text-muted2 hover:text-ink">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          즐겨찾기
        </a>
        <a href="mypage.html" class="flex items-center gap-1.5 text-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
          내 정보
        </a>
      </nav>
    </div>
    <div class="flex items-center gap-3">
      <a href="report.html" class="flex items-center gap-1.5 rounded-full bg-primary text-white text-[13px] font-bold px-4 py-2">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        식당 제보하기
      </a>
      <a href="login.html" class="rounded-full border border-navborder text-ink text-[13px] font-semibold px-4 py-2">로그인/회원가입</a>
    </div>
  </header>

  <div class="flex-1 overflow-y-auto pb-8 lg:pb-16">
    <div class="lg:max-w-3xl lg:mx-auto lg:px-6 lg:pt-8">

      <div class="hidden lg:flex items-center gap-3 mb-5">
        <a href="mypage.html" aria-label="내 정보로" class="w-8 h-8 flex items-center justify-center -ml-1.5">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        </a>
        <h1 class="text-[22px] font-bold text-ink">등록한 식당</h1>
      </div>

      <p class="px-5 lg:px-0 pt-4 lg:pt-0 text-[13px] text-muted2">총 2곳을 제보했어요</p>

      <div class="px-5 lg:px-0 pt-3 flex flex-col gap-3">
        <!-- 승인완료: 상세 화면으로 이동 가능 -->
        <a href="restaurant-detail.html" class="flex items-center gap-3 rounded-2xl border border-hairline p-3.5">
          <div class="w-14 h-14 rounded-xl bg-neutral-200 shrink-0"></div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-1.5">
              <p class="text-[12px] font-semibold text-primary">한식 · 국밥</p>
              <span class="rounded-full bg-promo text-primary text-[10px] font-bold px-1.5 py-0.5">승인완료</span>
            </div>
            <h3 class="text-[14px] font-bold text-ink truncate mt-0.5">혼밥각 국밥집</h3>
            <p class="text-[12px] text-muted2 mt-0.5">2026.08.03 제보</p>
          </div>
          <svg class="shrink-0" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A3A3A3" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </a>

        <!-- 승인대기: 아직 공개되지 않아 상세로 진입하지 않고 대기 상태만 안내 -->
        <div class="flex items-center gap-3 rounded-2xl border border-hairline p-3.5">
          <div class="w-14 h-14 rounded-xl bg-neutral-200 shrink-0"></div>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-1.5">
              <p class="text-[12px] font-semibold text-muted2">중식</p>
              <span class="rounded-full bg-neutral-100 text-muted2 text-[10px] font-bold px-1.5 py-0.5">승인대기</span>
            </div>
            <h3 class="text-[14px] font-bold text-ink truncate mt-0.5">신상 마라탕집</h3>
            <p class="text-[12px] text-muted2 mt-0.5">2026.08.10 제보 · 관리자 검수 중이에요</p>
          </div>
        </div>
      </div>

      <!-- 빈 상태: 제보한 식당이 없으면 노출 -->
      <div id="empty-state" class="hidden flex-col items-center justify-center text-center px-8 pt-20 lg:pt-24">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#A3A3A3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1-5h16l1 5M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9M9 21v-6h6v6"/></svg>
        <p class="text-[14px] font-bold text-ink mt-4">아직 제보한 식당이 없어요</p>
        <p class="text-[13px] text-muted2 mt-1">알고 있는 맛집을 제보하고 다른 사람과 나눠보세요</p>
        <a href="report.html" class="mt-5 rounded-xl bg-primary text-white text-[13px] font-bold px-5 py-2.5">식당 제보하기</a>
      </div>
    </div>
  </div>

  <!-- ================= 하단 네비게이션: 모바일 전용 ================= -->
  <nav class="lg:hidden absolute bottom-0 inset-x-0 z-40 bg-white border-t border-hairline flex items-stretch h-16">
    <a href="index.html" class="flex-1 flex flex-col items-center justify-center gap-0.5 text-muted">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
      <span class="text-[11px] font-semibold">지도 홈</span>
    </a>
    <a href="bookmarks.html" class="flex-1 flex flex-col items-center justify-center gap-0.5 text-muted">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      <span class="text-[11px] font-semibold">즐겨찾기</span>
    </a>
    <a href="mypage.html" class="flex-1 flex flex-col items-center justify-center gap-0.5 text-primary">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
      <span class="text-[11px] font-bold">내 정보</span>
    </a>
  </nav>
</div>
</body>
</html>
