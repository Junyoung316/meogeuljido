<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>먹을지도 · 비밀번호 재설정 화면 목업 (반응형)</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: '#FF6000', ink: '#222222', muted: '#A3A3A3', muted2: '#737373',
          hairline: '#E5E5E5', promo: '#FCF4EE', navborder: '#D4D4D4',
        },
        fontFamily: { sans: ['Pretendard Variable', 'Pretendard', '-apple-system', 'system-ui', 'sans-serif'] },
        boxShadow: { floating: '0 4px 16px rgba(34, 34, 34, 0.12)' },
      },
    },
  };
</script>
<style>
  html, body { height: 100%; }
  body { font-family: 'Pretendard Variable', 'Pretendard', -apple-system, system-ui, sans-serif; }
</style>
</head>
<!-- 인증 화면은 헤더 내비게이션 없이, 데스크톱에서는 중앙 정렬된 카드로만 확장 -->
<body class="bg-white lg:bg-neutral-50 lg:flex lg:items-start lg:justify-center lg:py-12">
<div class="relative min-h-screen w-full lg:min-h-0 lg:w-full lg:max-w-xl bg-white lg:rounded-2xl lg:border lg:border-hairline lg:shadow-floating overflow-hidden flex flex-col">

  <!-- ============ 헤더 ============ -->
  <header class="shrink-0 flex items-center justify-between px-4 py-3.5 border-b border-hairline">
    <a href="login.html" aria-label="뒤로가기" class="w-8 h-8 flex items-center justify-center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 class="text-[16px] font-bold text-ink">비밀번호 재설정</h1>
    <div class="w-8"></div>
  </header>

  <!-- ============ 진행 단계 표시 ============ -->
  <div id="progress-dots" class="flex items-center justify-center gap-2 pt-5">
    <span class="step-dot w-2 h-2 rounded-full bg-primary" data-step="1"></span>
    <span class="step-dot w-2 h-2 rounded-full bg-navborder" data-step="2"></span>
    <span class="step-dot w-2 h-2 rounded-full bg-navborder" data-step="3"></span>
  </div>

  <div class="flex-1 overflow-y-auto px-6 pb-10">

    <!-- ============ Step 1: 이메일 입력 ============ -->
    <section id="step-1" class="pt-8">
      <p class="text-[18px] font-bold text-ink">가입한 이메일을 입력해주세요</p>
      <p class="text-[13px] text-muted2 mt-1.5">인증코드를 이메일로 보내드릴게요</p>

      <div class="mt-6">
        <label class="text-[13px] font-semibold text-ink">이메일</label>
        <input id="reset-email" type="email" placeholder="you@example.com" class="mt-1.5 w-full rounded-xl border border-hairline px-3.5 py-3 text-[14px] outline-none focus:border-primary" />
        <p id="step1-error" class="hidden text-[12px] font-semibold text-red-500 mt-1.5">올바른 이메일 형식을 입력해주세요</p>
      </div>

      <button type="button" id="step1-submit" disabled class="mt-6 w-full rounded-xl bg-navborder text-white text-[15px] font-bold py-3.5 transition-colors">
        재설정 코드 받기
      </button>
    </section>

    <!-- ============ Step 2: 인증코드 입력 ============ -->
    <section id="step-2" class="hidden pt-8">
      <p class="text-[18px] font-bold text-ink">이메일로 받은 인증코드를 입력해주세요</p>
      <p id="step2-desc" class="text-[13px] text-muted2 mt-1.5">입력하신 이메일로 6자리 코드를 보냈어요</p>

      <div class="mt-6">
        <label class="text-[13px] font-semibold text-ink">인증코드</label>
        <input id="reset-code" type="text" inputmode="numeric" maxlength="6" placeholder="6자리 숫자 입력" class="mt-1.5 w-full rounded-xl border border-hairline px-3.5 py-3 text-[14px] tracking-[0.3em] outline-none focus:border-primary" />
        <p id="step2-error" class="hidden text-[12px] font-semibold text-red-500 mt-1.5">6자리 숫자를 모두 입력해주세요</p>
      </div>

      <button type="button" id="resend-btn" class="mt-3 text-[12px] font-semibold text-primary">
        코드를 받지 못하셨나요? 재발송
      </button>

      <button type="button" id="step2-submit" disabled class="mt-6 w-full rounded-xl bg-navborder text-white text-[15px] font-bold py-3.5 transition-colors">
        확인
      </button>
    </section>

    <!-- ============ Step 3: 새 비밀번호 설정 ============ -->
    <section id="step-3" class="hidden pt-8">
      <p class="text-[18px] font-bold text-ink">새 비밀번호를 설정해주세요</p>
      <p class="text-[13px] text-muted2 mt-1.5">영문, 숫자 포함 8자 이상으로 입력해주세요</p>

      <div class="mt-6 flex flex-col gap-4">
        <div>
          <label class="text-[13px] font-semibold text-ink">새 비밀번호</label>
          <div class="mt-1.5 relative">
            <input id="new-password" type="password" placeholder="영문, 숫자 포함 8자 이상" class="w-full rounded-xl border border-hairline px-3.5 py-3 pr-11 text-[14px] outline-none focus:border-primary" />
            <button type="button" class="toggle-password absolute right-3 top-1/2 -translate-y-1/2 text-muted2" data-target="new-password" aria-label="비밀번호 표시">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div>
          <label class="text-[13px] font-semibold text-ink">새 비밀번호 확인</label>
          <div class="mt-1.5 relative">
            <input id="new-password-confirm" type="password" placeholder="비밀번호를 다시 입력해주세요" class="w-full rounded-xl border border-hairline px-3.5 py-3 pr-11 text-[14px] outline-none focus:border-primary" />
            <button type="button" class="toggle-password absolute right-3 top-1/2 -translate-y-1/2 text-muted2" data-target="new-password-confirm" aria-label="비밀번호 표시">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p id="password-mismatch-msg" class="hidden text-[12px] font-semibold text-red-500 mt-1.5">비밀번호가 일치하지 않아요</p>
        </div>
      </div>

      <button type="button" id="step3-submit" disabled class="mt-6 w-full rounded-xl bg-navborder text-white text-[15px] font-bold py-3.5 transition-colors">
        비밀번호 변경
      </button>
    </section>

    <!-- ============ 완료 ============ -->
    <section id="step-complete" class="hidden pt-16 flex flex-col items-center text-center">
      <div class="w-16 h-16 rounded-full bg-promo flex items-center justify-center">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FF6000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <p class="text-[18px] font-bold text-ink mt-5">비밀번호가 변경되었어요</p>
      <p class="text-[13px] text-muted2 mt-1.5">새 비밀번호로 다시 로그인해주세요</p>

      <a href="login.html" class="mt-8 w-full rounded-xl bg-primary text-white text-[15px] font-bold py-3.5 text-center">
        로그인하러 가기
      </a>
    </section>
  </div>
</div>

<script>
  // ---------- 단계 전환 ----------
  function goToStep(step) {
    ['step-1', 'step-2', 'step-3', 'step-complete'].forEach(id => {
      document.getElementById(id).classList.add('hidden');
    });
    document.getElementById(step === 'complete' ? 'step-complete' : `step-${step}`).classList.remove('hidden');

    const dotsWrap = document.getElementById('progress-dots');
    if (step === 'complete') {
      dotsWrap.classList.add('hidden');
    } else {
      dotsWrap.classList.remove('hidden');
      document.querySelectorAll('.step-dot').forEach(dot => {
        const active = Number(dot.dataset.step) <= step;
        dot.classList.toggle('bg-primary', active);
        dot.classList.toggle('bg-navborder', !active);
      });
    }
  }

  // ---------- Step 1: 이메일 ----------
  // 버튼은 입력값이 유효할 때까지 disabled 상태를 유지하되(원래 방식), 입력 중에도 왜 비활성인지 알 수 있도록
  // 값이 있는데 아직 유효하지 않을 때는 바로 아래에 오류 문구를 함께 보여준다.
  const resetEmail = document.getElementById('reset-email');
  const step1Submit = document.getElementById('step1-submit');
  const step1Error = document.getElementById('step1-error');
  resetEmail.addEventListener('input', () => {
    const valid = resetEmail.value.includes('@') && resetEmail.value.includes('.');
    step1Submit.disabled = !valid;
    step1Submit.classList.toggle('bg-primary', valid);
    step1Submit.classList.toggle('bg-navborder', !valid);
    step1Error.classList.toggle('hidden', valid || resetEmail.value.length === 0);
  });
  step1Submit.addEventListener('click', () => {
    if (step1Submit.disabled) return;
    document.getElementById('step2-desc').textContent = `${resetEmail.value}로 6자리 코드를 보냈어요`;
    goToStep(2);
  });

  // ---------- Step 2: 인증코드 ----------
  const resetCode = document.getElementById('reset-code');
  const step2Submit = document.getElementById('step2-submit');
  const step2Error = document.getElementById('step2-error');
  resetCode.addEventListener('input', () => {
    resetCode.value = resetCode.value.replace(/\D/g, '').slice(0, 6);
    const valid = resetCode.value.length === 6;
    step2Submit.disabled = !valid;
    step2Submit.classList.toggle('bg-primary', valid);
    step2Submit.classList.toggle('bg-navborder', !valid);
    step2Error.classList.toggle('hidden', valid || resetCode.value.length === 0);
  });
  step2Submit.addEventListener('click', () => {
    if (step2Submit.disabled) return;
    goToStep(3);
  });

  // ---------- 재발송 카운트다운 ----------
  const resendBtn = document.getElementById('resend-btn');
  resendBtn.addEventListener('click', () => {
    let remaining = 60;
    resendBtn.disabled = true;
    resendBtn.classList.replace('text-primary', 'text-muted2');
    const timer = setInterval(() => {
      resendBtn.textContent = `${remaining}초 후 다시 시도할 수 있어요`;
      remaining -= 1;
      if (remaining < 0) {
        clearInterval(timer);
        resendBtn.disabled = false;
        resendBtn.textContent = '코드를 받지 못하셨나요? 재발송';
        resendBtn.classList.replace('text-muted2', 'text-primary');
      }
    }, 1000);
  });

  // ---------- Step 3: 새 비밀번호 ----------
  document.querySelectorAll('.toggle-password').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      input.type = input.type === 'password' ? 'text' : 'password';
    });
  });

  const newPassword = document.getElementById('new-password');
  const newPasswordConfirm = document.getElementById('new-password-confirm');
  const mismatchMsg = document.getElementById('password-mismatch-msg');
  const step3Submit = document.getElementById('step3-submit');

  function checkStep3() {
    const mismatch = newPasswordConfirm.value.length > 0 && newPassword.value !== newPasswordConfirm.value;
    mismatchMsg.classList.toggle('hidden', !mismatch);
    const valid = newPassword.value.length >= 8 && newPassword.value === newPasswordConfirm.value;
    step3Submit.disabled = !valid;
    step3Submit.classList.toggle('bg-primary', valid);
    step3Submit.classList.toggle('bg-navborder', !valid);
  }
  newPassword.addEventListener('input', checkStep3);
  newPasswordConfirm.addEventListener('input', checkStep3);

  step3Submit.addEventListener('click', () => {
    if (step3Submit.disabled) return;
    goToStep('complete');
  });
</script>
</body>
</html>
