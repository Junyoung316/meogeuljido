<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>먹을지도 · 1:1 문의 작성 화면 목업 (반응형)</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: '#FF6000', ink: '#222222', muted: '#A3A3A3', muted2: '#737373',
          hairline: '#E5E5E5', promo: '#FCF4EE', navborder: '#D4D4D4',
        },
        fontFamily: { sans: ['Pretendard Variable', 'Pretendard', '-apple-system', 'system-ui', 'sans-serif'] },
        boxShadow: { floating: '0 4px 16px rgba(34, 34, 34, 0.12)' },
      },
    },
  };
</script>
<style>
  html, body { height: 100%; }
  body { font-family: 'Pretendard Variable', 'Pretendard', -apple-system, system-ui, sans-serif; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .type-chip[aria-pressed="true"] { background-color: #222222; color: #fff; border-color: #222222; }
</style>
</head>
<!-- 데스크톱에서는 폼을 화면 전체로 늘리지 않고 중앙 정렬된 카드(모달 폭)로 유지 -->
<body class="bg-white lg:bg-neutral-50 lg:flex lg:items-start lg:justify-center lg:py-12">
<div class="relative min-h-screen w-full lg:min-h-0 lg:w-full lg:max-w-xl bg-white lg:rounded-2xl lg:border lg:border-hairline lg:shadow-floating overflow-hidden flex flex-col">

  <!-- ============ 헤더 ============ -->
  <header class="shrink-0 flex items-center justify-between px-4 py-3.5 border-b border-hairline">
    <a href="inquiries.html" aria-label="뒤로가기" class="w-8 h-8 flex items-center justify-center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2.2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <h1 class="text-[16px] font-bold text-ink">문의하기</h1>
    <div class="w-8"></div>
  </header>

  <form id="inquiry-form" class="flex-1 overflow-y-auto pb-28 lg:flex-none lg:overflow-visible lg:pb-6">
    <div class="px-5 py-4 flex flex-col gap-5">

      <div>
        <label class="text-[13px] font-bold text-ink">문의 유형 <span class="text-primary">*</span></label>
        <div class="mt-1.5 flex flex-wrap gap-2" id="type-group">
          <button type="button" class="type-chip rounded-full border border-navborder px-3 py-1.5 text-[12px] font-semibold text-ink" aria-pressed="false">제보 오류</button>
          <button type="button" class="type-chip rounded-full border border-navborder px-3 py-1.5 text-[12px] font-semibold text-ink" aria-pressed="false">리뷰 신고</button>
          <button type="button" class="type-chip rounded-full border border-navborder px-3 py-1.5 text-[12px] font-semibold text-ink" aria-pressed="false">계정 문의</button>
          <button type="button" class="type-chip rounded-full border border-navborder px-3 py-1.5 text-[12px] font-semibold text-ink" aria-pressed="false">기타</button>
        </div>
      </div>

      <div>
        <label class="text-[13px] font-bold text-ink">제목 <span class="text-primary">*</span></label>
        <input id="title-input" type="text" placeholder="문의 제목을 입력해주세요" class="mt-1.5 w-full rounded-xl border border-hairline px-3.5 py-3 text-[14px] outline-none focus:border-primary" />
      </div>

      <div>
        <label class="text-[13px] font-bold text-ink">내용 <span class="text-primary">*</span></label>
        <textarea
          id="content-input"
          maxlength="1000"
          rows="6"
          placeholder="문의하실 내용을 자세히 적어주세요"
          class="mt-1.5 w-full rounded-2xl border border-hairline p-3.5 text-[14px] text-ink placeholder-muted outline-none focus:border-primary resize-none"
        ></textarea>
        <p class="text-right text-[12px] text-muted2 mt-1"><span id="char-count">0</span>/1000</p>
      </div>

      <div>
        <label class="text-[13px] font-bold text-ink">사진 첨부 <span class="text-muted2 font-medium">(선택, 최대 3장)</span></label>
        <div class="flex gap-2 mt-1.5 overflow-x-auto no-scrollbar" id="photo-row">
          <button type="button" id="add-photo-btn" class="shrink-0 w-20 h-20 rounded-xl border-2 border-dashed border-navborder flex flex-col items-center justify-center gap-1 text-muted2">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 15-5-5-9 9"/></svg>
            <span id="photo-count" class="text-[11px] font-semibold">0/3</span>
          </button>
        </div>
      </div>
    </div>
  </form>

  <!-- ============ 제출 버튼: 모바일은 하단 고정, 데스크톱은 카드 내부 정적 배치 ============ -->
  <div class="absolute bottom-0 inset-x-0 lg:static lg:inset-auto bg-white border-t border-hairline px-4 py-3">
    <p id="submit-hint" class="hidden text-[12px] font-semibold text-red-500 mb-2">문의 유형, 제목, 내용을 모두 입력해주세요</p>
    <button type="button" id="submit-btn" disabled class="w-full rounded-xl bg-navborder text-white text-[15px] font-bold py-3.5 transition-colors">
      문의 등록하기
    </button>
  </div>
</div>

<script>
  // ---------- 문의 유형: 단일 선택 ----------
  const typeButtons = [...document.querySelectorAll('#type-group .type-chip')];
  typeButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      typeButtons.forEach(b => b.setAttribute('aria-pressed', 'false'));
      btn.setAttribute('aria-pressed', 'true');
      updateSubmitState();
    });
  });

  // ---------- 글자 수 카운트 ----------
  const contentInput = document.getElementById('content-input');
  contentInput.addEventListener('input', () => {
    document.getElementById('char-count').textContent = contentInput.value.length;
    updateSubmitState();
  });

  // ---------- 사진 첨부: 최대 3장 ----------
  const photoRow = document.getElementById('photo-row');
  const addPhotoBtn = document.getElementById('add-photo-btn');
  const photoCount = document.getElementById('photo-count');
  let photoNum = 0;
  addPhotoBtn.addEventListener('click', () => {
    if (photoNum >= 3) return;
    photoNum += 1;
    const thumb = document.createElement('div');
    thumb.className = 'shrink-0 w-20 h-20 rounded-xl bg-neutral-200';
    photoRow.insertBefore(thumb, addPhotoBtn);
    photoCount.textContent = `${photoNum}/3`;
    if (photoNum >= 3) addPhotoBtn.classList.add('hidden');
  });

  // ---------- 제출 버튼 활성화 조건 ----------
  const titleInput = document.getElementById('title-input');
  const submitBtn = document.getElementById('submit-btn');
  const submitHint = document.getElementById('submit-hint');
  let inquiryInteracted = false;

  function updateSubmitState() {
    inquiryInteracted = true;
    const typeSelected = typeButtons.some(b => b.getAttribute('aria-pressed') === 'true');
    const missing = [];
    if (!typeSelected) missing.push('문의 유형');
    if (titleInput.value.trim().length === 0) missing.push('제목');
    if (contentInput.value.trim().length === 0) missing.push('내용');

    const enabled = missing.length === 0;
    submitBtn.disabled = !enabled;
    submitBtn.classList.toggle('bg-primary', enabled);
    submitBtn.classList.toggle('bg-navborder', !enabled);
    submitHint.textContent = `${missing.join(', ')}을(를) 입력해주세요`;
    submitHint.classList.toggle('hidden', enabled || !inquiryInteracted);
  }
  titleInput.addEventListener('input', updateSubmitState);

  submitBtn.addEventListener('click', () => {
    if (submitBtn.disabled) return;
    window.location.href = 'inquiries.html';
  });
</script>
</body>
</html>
