<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>먹을지도 · 아무거나 추천 결과 화면 목업 (반응형)</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: '#FF6000', ink: '#222222', muted: '#A3A3A3', muted2: '#737373',
          hairline: '#E5E5E5', promo: '#FCF4EE', navborder: '#D4D4D4',
        },
        fontFamily: { sans: ['Pretendard Variable', 'Pretendard', '-apple-system', 'system-ui', 'sans-serif'] },
        boxShadow: { floating: '0 4px 16px rgba(34, 34, 34, 0.12)' },
      },
    },
  };
</script>
<style>
  html, body { height: 100%; }
  body { font-family: 'Pretendard Variable', 'Pretendard', -apple-system, system-ui, sans-serif; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  #hero-card { transition: opacity 0.22s ease, transform 0.22s ease; }
  #hero-card.swapping { opacity: 0; transform: scale(0.97); }
  .alt-card[data-active="true"] { border-color: #FF6000; background: #FCF4EE; }
</style>
</head>
<body class="bg-white">
<div class="relative min-h-screen w-full bg-white flex flex-col">

  <header class="shrink-0 flex items-center justify-between px-4 py-3.5 lg:max-w-3xl lg:mx-auto lg:w-full">
    <div class="w-8"></div>
    <h1 class="text-[15px] lg:text-[17px] font-bold text-ink">오늘의 아무거나 추천</h1>
    <a href="index.html" aria-label="닫기" class="w-8 h-8 flex items-center justify-center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </a>
  </header>

  <div class="flex-1 overflow-y-auto pb-28 lg:pb-16">
    <div class="lg:max-w-3xl lg:mx-auto">
      <div class="px-5">
        <p class="text-[13px] text-muted2">아래 조건과 반경 1km 안에서 골라봤어요</p>
        <div id="selected-tags" class="flex flex-wrap gap-1.5 mt-2"></div>
      </div>

      <!-- 히어로 추천 카드 -->
      <div class="px-5 mt-4">
        <div id="hero-card" class="rounded-3xl border border-hairline overflow-hidden shadow-floating lg:flex">
          <div class="h-44 lg:h-auto lg:w-72 lg:shrink-0 bg-neutral-300 flex items-center justify-center text-neutral-400 text-[13px] font-medium">매장 사진 영역</div>
          <div class="p-4 lg:p-6 lg:flex-1">
            <p id="hero-cat" class="text-[12px] font-semibold text-primary">한식 · 국밥</p>
            <h2 id="hero-name" class="text-[19px] lg:text-[24px] font-bold text-ink mt-0.5">혼밥각 국밥집</h2>
            <div class="flex items-center gap-1.5 mt-1.5 text-[13px]">
              <span class="flex items-center gap-0.5 font-bold text-ink">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="#FF6000"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg>
                <span id="hero-rating">4.8</span>
              </span>
              <span class="text-muted2">리뷰 <span id="hero-reviews">211</span>개 · <span id="hero-distance">320m</span></span>
            </div>
            <div id="hero-tags" class="flex flex-wrap gap-1.5 mt-3"></div>
            <a href="restaurant-detail.html" class="mt-4 flex items-center justify-center w-full lg:w-auto lg:px-8 rounded-xl border border-hairline text-ink text-[13px] font-bold py-2.5">
              지도에서 위치 보기
            </a>
          </div>
        </div>
      </div>

      <!-- 다른 후보 -->
      <div class="mt-6 px-5">
        <p class="text-[14px] font-bold text-ink">다른 후보도 있어요</p>
        <div class="flex gap-3 mt-3 overflow-x-auto no-scrollbar pb-1 lg:grid lg:grid-cols-4 lg:overflow-visible lg:pb-0" id="alt-list"></div>
      </div>
    </div>
  </div>

  <!-- 하단 고정 액션: 모바일은 뷰포트 바닥에 고정, 데스크톱은 콘텐츠 흐름 안에 정적 배치 -->
  <div class="absolute bottom-0 inset-x-0 lg:static lg:inset-auto bg-white border-t border-hairline px-5 py-3 flex items-center gap-3 lg:max-w-3xl lg:mx-auto lg:mt-8 lg:mb-10 lg:rounded-2xl lg:border lg:border-hairline">
    <button id="reroll-btn" aria-label="다시 뽑기" class="shrink-0 w-14 h-14 rounded-xl border border-hairline flex items-center justify-center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 1 2.6 6.4M3 12v6h6"/></svg>
    </button>
    <a href="restaurant-detail.html" class="flex-1 flex items-center justify-center rounded-xl bg-primary text-white text-[15px] font-bold py-3.5">
      이 집으로 결정!
    </a>
  </div>
</div>

<script>
  // 목업용 후보 데이터: 실제로는 PostGIS 반경 검색 + JSONB 태그 교차 필터링 결과로 대체됨
  const candidates = [
    { name: '혼밥각 국밥집', cat: '한식 · 국밥', rating: '4.8', reviews: '211', distance: '320m', tags: ['#국물', '#혼밥', '#24시간'] },
    { name: '사장님 고기서비스', cat: '고기집', rating: '4.6', reviews: '342', distance: '540m', tags: ['#볶음', '#회식', '#술안주'] },
    { name: '동네 카페 온기', cat: '카페 · 디저트', rating: '4.5', reviews: '97', distance: '610m', tags: ['#디저트', '#카공', '#조용함'] },
    { name: '중화반점', cat: '중식', rating: '4.1', reviews: '64', distance: '710m', tags: ['#볶음', '#배달', '#매콤'] },
  ];
  let activeIndex = 0;

  const params = new URLSearchParams(window.location.search);
  const tags = (params.get('tags') || '#국물,#혼밥').split(',').filter(Boolean);
  document.getElementById('selected-tags').innerHTML = tags
    .map(t => `<span class="rounded-full bg-promo text-primary text-[12px] font-semibold px-2.5 py-1">${t}</span>`)
    .join('');

  function renderHero(index) {
    const c = candidates[index];
    document.getElementById('hero-cat').textContent = c.cat;
    document.getElementById('hero-name').textContent = c.name;
    document.getElementById('hero-rating').textContent = c.rating;
    document.getElementById('hero-reviews').textContent = c.reviews;
    document.getElementById('hero-distance').textContent = c.distance;
    document.getElementById('hero-tags').innerHTML = c.tags
      .map(t => `<span class="rounded-full bg-neutral-100 text-muted2 text-[12px] font-semibold px-2.5 py-1">${t}</span>`)
      .join('');
  }

  function renderAltList() {
    const wrap = document.getElementById('alt-list');
    wrap.innerHTML = candidates
      .map((c, i) => `
        <button class="alt-card shrink-0 w-32 lg:w-full lg:shrink rounded-2xl border border-hairline p-2.5 text-left" data-index="${i}" data-active="${i === activeIndex}">
          <div class="w-full h-20 rounded-xl bg-neutral-200"></div>
          <p class="text-[11px] font-semibold text-primary mt-2">${c.cat}</p>
          <p class="text-[13px] font-bold text-ink truncate">${c.name}</p>
          <p class="text-[11px] text-muted2 mt-0.5">★ ${c.rating} · ${c.distance}</p>
        </button>
      `)
      .join('');

    wrap.querySelectorAll('.alt-card').forEach(card => {
      card.addEventListener('click', () => selectCandidate(Number(card.dataset.index)));
    });
  }

  function selectCandidate(index) {
    activeIndex = index;
    const hero = document.getElementById('hero-card');
    hero.classList.add('swapping');
    setTimeout(() => {
      renderHero(activeIndex);
      hero.classList.remove('swapping');
    }, 220);
    renderAltList();
  }

  // 다시 뽑기: 현재 후보를 제외한 다음 후보로 순환 이동
  document.getElementById('reroll-btn').addEventListener('click', () => {
    const next = (activeIndex + 1) % candidates.length;
    selectCandidate(next);
  });

  renderHero(activeIndex);
  renderAltList();
</script>
</body>
</html>
