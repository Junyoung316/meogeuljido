<!DOCTYPE html>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {

          primary: '#FF6000', ink: '#222222', muted: '#A3A3A3', muted2: '#737373',
          hairline: '#E5E5E5', promo: '#FCF4EE', navborder: '#D4D4D4',

  .inquiry-row[data-active="true"] { background-color: #FCF4EE; border-color: #FF6000; }
</style>
</head>
<body class="bg-neutral-50">
<div class="min-h-screen flex">

  <!-- ============ 사이드바 ============ -->

    <div class="px-3 py-4 border-t border-hairline">

        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>
        사용자 화면으로

  <!-- ============ 컨텐츠 ============ -->
  <div class="flex-1 min-w-0 flex flex-col">
    <header class="h-16 shrink-0 border-b border-hairline flex items-center justify-between px-8 bg-white">
      <h1 class="text-[18px] font-bold text-ink">1:1문의 관리</h1>
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-full bg-promo flex items-center justify-center text-[12px] font-bold text-primary">관</div>

    <main class="flex-1 overflow-y-auto flex min-h-0">

      <!-- 좌측: 문의 리스트 -->
      <div class="w-96 shrink-0 border-r border-hairline flex flex-col bg-white">
        <div class="p-4 border-b border-hairline flex items-center gap-1.5">
          <button class="status-tab rounded-lg px-3 py-1.5 text-[13px] font-semibold text-ink" aria-pressed="true">전체</button>
          <button class="status-tab rounded-lg px-3 py-1.5 text-[13px] font-semibold text-muted2" aria-pressed="false">답변대기</button>
          <button class="status-tab rounded-lg px-3 py-1.5 text-[13px] font-semibold text-muted2" aria-pressed="false">답변완료</button>
        </div>
        <div class="flex-1 overflow-y-auto">
          <button class="inquiry-row w-full text-left px-4 py-3.5 border-b border-hairline border-l-4 border-l-transparent" data-active="true">
            <div class="flex items-center justify-between gap-2">
              <span class="rounded-full bg-neutral-100 text-muted2 text-[10px] font-semibold px-2 py-0.5">제보 오류</span>
              <span class="shrink-0 rounded-full border border-navborder text-muted2 text-[10px] font-bold px-2 py-0.5">답변대기</span>
            </div>
            <p class="text-[13px] font-bold text-ink mt-1.5 truncate">식당 위치가 지도에 잘못 표시돼요</p>
            <p class="text-[11px] text-muted2 mt-0.5">혼밥러버 · 2026.08.09</p>
          </button>

          <button class="inquiry-row w-full text-left px-4 py-3.5 border-b border-hairline border-l-4 border-l-transparent" data-active="false">
            <div class="flex items-center justify-between gap-2">
              <span class="rounded-full bg-neutral-100 text-muted2 text-[10px] font-semibold px-2 py-0.5">계정 문의</span>
              <span class="shrink-0 rounded-full bg-promo text-primary text-[10px] font-bold px-2 py-0.5">답변완료</span>
            </div>
            <p class="text-[13px] font-bold text-ink mt-1.5 truncate">비밀번호 재설정 이메일이 안 와요</p>
            <p class="text-[11px] text-muted2 mt-0.5">김밥러버 · 2026.08.05</p>
          </button>

          <button class="inquiry-row w-full text-left px-4 py-3.5 border-b border-hairline border-l-4 border-l-transparent" data-active="false">
            <div class="flex items-center justify-between gap-2">
              <span class="rounded-full bg-neutral-100 text-muted2 text-[10px] font-semibold px-2 py-0.5">리뷰 신고</span>
              <span class="shrink-0 rounded-full bg-promo text-primary text-[10px] font-bold px-2 py-0.5">답변완료</span>
            </div>
            <p class="text-[13px] font-bold text-ink mt-1.5 truncate">악성 리뷰를 신고하고 싶어요</p>
            <p class="text-[11px] text-muted2 mt-0.5">박국밥 · 2026.07.28</p>
          </button>

          <button class="inquiry-row w-full text-left px-4 py-3.5 border-b border-hairline border-l-4 border-l-transparent" data-active="false">
            <div class="flex items-center justify-between gap-2">
              <span class="rounded-full bg-neutral-100 text-muted2 text-[10px] font-semibold px-2 py-0.5">기타</span>
              <span class="shrink-0 rounded-full border border-navborder text-muted2 text-[10px] font-bold px-2 py-0.5">답변대기</span>
            </div>
            <p class="text-[13px] font-bold text-ink mt-1.5 truncate">사업자 제휴 문의드립니다</p>
            <p class="text-[11px] text-muted2 mt-0.5">카페인중독 · 2026.07.20</p>
          </button>

          <button class="inquiry-row w-full text-left px-4 py-3.5 border-b border-hairline border-l-4 border-l-transparent" data-active="false">
            <div class="flex items-center justify-between gap-2">
              <span class="rounded-full bg-neutral-100 text-muted2 text-[10px] font-semibold px-2 py-0.5">제보 오류</span>
              <span class="shrink-0 rounded-full bg-promo text-primary text-[10px] font-bold px-2 py-0.5">답변완료</span>
            </div>
            <p class="text-[13px] font-bold text-ink mt-1.5 truncate">중복 등록된 식당이 있는 것 같아요</p>
            <p class="text-[11px] text-muted2 mt-0.5">짜장맨 · 2026.07.12</p>

        </div>
      </div>

      <!-- 우측: 상세 패널 -->
      <div class="flex-1 min-w-0 overflow-y-auto px-8 py-6">
        <div class="max-w-2xl">
          <div class="flex items-center justify-between gap-2">
            <span class="rounded-full bg-neutral-100 text-muted2 text-[11px] font-semibold px-2.5 py-1">제보 오류</span>
            <span class="shrink-0 rounded-full border border-navborder text-muted2 text-[11px] font-bold px-2.5 py-1">답변대기</span>
          </div>
          <h2 class="text-[19px] font-bold text-ink mt-3">식당 위치가 지도에 잘못 표시돼요</h2>
          <p class="text-[12px] text-muted2 mt-1">혼밥러버 (food_lover@meogeuljido.com) · 2026.08.09</p>

          <p class="text-[14px] text-ink leading-relaxed mt-4">
            '혼밥각 국밥집'을 지도에서 찾으면 실제 위치보다 골목 하나 위쪽에 마커가 찍혀요. 등록할 때 위치를 잘못 선택한 것 같은데, 제가 직접 수정할 수 없어서 문의드립니다.

          <div class="h-px bg-hairline my-6"></div>

          <div class="flex justify-end mt-3">

          </div>
        </div>

<script>
  const statusTabs = [...document.querySelectorAll('.status-tab')];
  statusTabs.forEach(btn => {
    btn.addEventListener('click', () => {
      statusTabs.forEach(b => { b.setAttribute('aria-pressed', 'false'); b.classList.add('text-muted2'); b.classList.remove('text-ink'); });
      btn.setAttribute('aria-pressed', 'true');
    });
  });

  document.querySelectorAll('.inquiry-row').forEach(row => {
    row.addEventListener('click', () => {
      document.querySelectorAll('.inquiry-row').forEach(r => {
        r.dataset.active = 'false';
        r.classList.add('border-l-transparent');
      });
      row.dataset.active = 'true';
      row.classList.remove('border-l-transparent');
    });
  });
</script>
</body>
</html>
