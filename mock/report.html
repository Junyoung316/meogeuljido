<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>먹을지도 · 식당 제보 화면 목업 (반응형)</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: '#FF6000', ink: '#222222', muted: '#A3A3A3', muted2: '#737373',
          hairline: '#E5E5E5', promo: '#FCF4EE', navborder: '#D4D4D4',
        },
        fontFamily: { sans: ['Pretendard Variable', 'Pretendard', '-apple-system', 'system-ui', 'sans-serif'] },
        boxShadow: { floating: '0 4px 16px rgba(34, 34, 34, 0.12)' },
      },
    },
  };
</script>
<style>
  html, body { height: 100%; }
  body { font-family: 'Pretendard Variable', 'Pretendard', -apple-system, system-ui, sans-serif; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .cat-chip[aria-pressed="true"] { background-color: #222222; color: #fff; border-color: #222222; }
  .facility-chip[aria-pressed="true"] { background-color: #FF6000; color: #fff; border-color: #FF6000; }
</style>
</head>
<!-- 데스크톱에서는 폼을 화면 전체로 늘리지 않고 중앙 정렬된 카드(모달 폭)로 유지 -->
<body class="bg-white lg:bg-neutral-50 lg:flex lg:items-start lg:justify-center lg:py-12">
<div class="relative min-h-screen w-full lg:min-h-0 lg:w-full lg:max-w-xl bg-white lg:rounded-2xl lg:border lg:border-hairline lg:shadow-floating overflow-hidden flex flex-col">

  <!-- ============ 헤더 ============ -->
  <header class="shrink-0 flex items-center justify-between px-4 py-3.5 border-b border-hairline">
    <a href="index.html" aria-label="닫기" class="w-8 h-8 flex items-center justify-center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#222222" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </a>
    <h1 class="text-[16px] font-bold text-ink">식당 제보하기</h1>
    <div class="w-8"></div>
  </header>

  <form id="report-form" class="flex-1 overflow-y-auto pb-28 lg:flex-none lg:overflow-visible lg:pb-6">
    <div class="px-5 py-4 flex flex-col gap-5">

      <!-- 중복 등록 방지 안내 -->
      <div class="flex items-start gap-2 rounded-2xl bg-promo px-3.5 py-3">
        <svg class="shrink-0 mt-0.5" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FF6000" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <p class="text-[12px] text-primary leading-relaxed font-medium">입력하신 위치 반경 내 유사한 상호명이 있는지 자동으로 확인한 뒤 등록돼요. 이미 등록된 식당이라면 리뷰로 참여해주세요.</p>
      </div>

      <div>
        <label class="text-[13px] font-bold text-ink">상호명 <span class="text-primary">*</span></label>
        <input id="name-input" type="text" placeholder="예) 혼밥각 국밥집" class="mt-1.5 w-full rounded-xl border border-hairline px-3.5 py-3 text-[14px] outline-none focus:border-primary" />
      </div>

      <div>
        <label class="text-[13px] font-bold text-ink">위치 <span class="text-primary">*</span></label>
        <button type="button" id="location-btn" class="mt-1.5 w-full flex items-center justify-between rounded-xl border border-hairline px-3.5 py-3 text-[14px] text-muted2">
          <span id="location-label">지도에서 위치 선택하기</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
      </div>

      <div>
        <label class="text-[13px] font-bold text-ink">카테고리 <span class="text-primary">*</span></label>
        <div class="mt-1.5 flex flex-wrap gap-2" id="category-group">
          <button type="button" class="cat-chip rounded-full border border-navborder px-3 py-1.5 text-[12px] font-semibold text-ink" aria-pressed="false">한식</button>
          <button type="button" class="cat-chip rounded-full border border-navborder px-3 py-1.5 text-[12px] font-semibold text-ink" aria-pressed="false">중식</button>
          <button type="button" class="cat-chip rounded-full border border-navborder px-3 py-1.5 text-[12px] font-semibold text-ink" aria-pressed="false">일식</button>
          <button type="button" class="cat-chip rounded-full border border-navborder px-3 py-1.5 text-[12px] font-semibold text-ink" aria-pressed="false">카페</button>
          <button type="button" class="cat-chip rounded-full border border-navborder px-3 py-1.5 text-[12px] font-semibold text-ink" aria-pressed="false">고기집</button>
          <button type="button" class="cat-chip rounded-full border border-navborder px-3 py-1.5 text-[12px] font-semibold text-ink" aria-pressed="false">분식</button>
        </div>
      </div>

      <div>
        <label class="text-[13px] font-bold text-ink">영업시간 <span class="text-primary">*</span></label>
        <input id="hours-input" type="text" placeholder="예) 매일 11:00 - 22:00" class="mt-1.5 w-full rounded-xl border border-hairline px-3.5 py-3 text-[14px] outline-none focus:border-primary" />
      </div>

      <!-- 부가 정보: additional_info(JSONB)로 저장될 편의시설 태그 -->
      <div>
        <label class="text-[13px] font-bold text-ink">편의시설 <span class="text-muted2 font-medium">(선택)</span></label>
        <div class="mt-1.5 flex flex-wrap gap-2">
          <button type="button" class="facility-chip rounded-full border border-navborder px-3 py-1.5 text-[12px] font-semibold text-ink" aria-pressed="false">주차 가능</button>
          <button type="button" class="facility-chip rounded-full border border-navborder px-3 py-1.5 text-[12px] font-semibold text-ink" aria-pressed="false">포장 가능</button>
          <button type="button" class="facility-chip rounded-full border border-navborder px-3 py-1.5 text-[12px] font-semibold text-ink" aria-pressed="false">반려동물 동반</button>
          <button type="button" class="facility-chip rounded-full border border-navborder px-3 py-1.5 text-[12px] font-semibold text-ink" aria-pressed="false">24시간</button>
          <button type="button" class="facility-chip rounded-full border border-navborder px-3 py-1.5 text-[12px] font-semibold text-ink" aria-pressed="false">단체석</button>
        </div>
      </div>

      <div>
        <label class="text-[13px] font-bold text-ink">매장/메뉴 사진 <span class="text-muted2 font-medium">(선택)</span></label>
        <div class="flex gap-2 mt-1.5 overflow-x-auto no-scrollbar" id="photo-row">
          <button type="button" id="add-photo-btn" class="shrink-0 w-20 h-20 rounded-xl border-2 border-dashed border-navborder flex flex-col items-center justify-center gap-1 text-muted2">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 15-5-5-9 9"/></svg>
            <span id="photo-count" class="text-[11px] font-semibold">0/5</span>
          </button>
        </div>
      </div>
    </div>
  </form>

  <!-- ============ 제출 버튼: 모바일은 하단 고정, 데스크톱은 카드 내부 정적 배치 ============ -->
  <div class="absolute bottom-0 inset-x-0 lg:static lg:inset-auto bg-white border-t border-hairline px-4 py-3">
    <p id="submit-hint" class="hidden text-[12px] font-semibold text-red-500 mb-2">상호명, 위치, 카테고리, 영업시간을 모두 입력해주세요</p>
    <button type="button" id="submit-btn" disabled class="w-full rounded-xl bg-navborder text-white text-[15px] font-bold py-3.5 transition-colors">
      제보 완료
    </button>
  </div>

  <!-- ============ 중복 의심 후보 모달: POST /api/restaurants/check-duplicate (duplicateSuspected: true) 대응 ============ -->
  <div id="duplicate-modal" class="hidden fixed inset-0 z-50 items-end lg:items-center justify-center">
    <div id="duplicate-backdrop" class="absolute inset-0 bg-ink/40"></div>
    <div role="dialog" aria-modal="true" aria-labelledby="duplicate-title" class="relative w-full lg:w-[420px] lg:rounded-3xl rounded-t-3xl bg-white p-5 pb-7 lg:pb-6 shadow-sheet max-h-[85vh] overflow-y-auto">
      <div class="flex items-start justify-between gap-2.5">
        <div class="flex items-start gap-2.5 min-w-0">
          <svg class="shrink-0 mt-0.5" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FF6000" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          <div class="min-w-0">
            <h2 id="duplicate-title" class="text-[16px] font-bold text-ink">비슷한 식당이 이미 있어요</h2>
            <p class="text-[12px] text-muted2 mt-1 leading-relaxed">입력하신 위치 근처에 상호명이 유사한 식당을 찾았어요. 이미 등록된 곳이라면 새로 등록하는 대신 리뷰로 참여해주세요.</p>
          </div>
        </div>
        <button type="button" id="duplicate-close" aria-label="닫기" class="shrink-0 w-8 h-8 -mt-1 -mr-1 rounded-full flex items-center justify-center text-muted2">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="mt-4 flex flex-col gap-2.5">
        <a href="restaurant-detail.html" class="flex items-center gap-3 rounded-2xl border border-hairline p-3">
          <div class="w-12 h-12 rounded-xl bg-neutral-200 shrink-0"></div>
          <div class="min-w-0">
            <p class="text-[12px] font-semibold text-primary">한식 · 국밥</p>
            <h3 class="text-[14px] font-bold text-ink truncate">혼밥각 국밥집</h3>
            <p class="text-[12px] text-muted2 mt-0.5">서울 마포구 어울길 12-3 · 42m</p>
          </div>
        </a>
      </div>

      <div class="flex gap-2 mt-5">
        <button type="button" id="duplicate-edit" class="flex-1 rounded-xl border border-hairline text-ink text-[14px] font-bold py-3">이름 다시 입력하기</button>
        <button type="button" id="duplicate-proceed" class="flex-1 rounded-xl bg-primary text-white text-[14px] font-bold py-3">그래도 제보하기</button>
      </div>
    </div>
  </div>
</div>

<script>
  // ---------- 카테고리: 단일 선택 ----------
  const categoryButtons = [...document.querySelectorAll('#category-group .cat-chip')];
  categoryButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      categoryButtons.forEach(b => b.setAttribute('aria-pressed', 'false'));
      btn.setAttribute('aria-pressed', 'true');
      updateSubmitState();
    });
  });

  // ---------- 편의시설: 다중 선택 ----------
  document.querySelectorAll('.facility-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      const pressed = btn.getAttribute('aria-pressed') === 'true';
      btn.setAttribute('aria-pressed', String(!pressed));
    });
  });

  // ---------- 위치 선택 (목업 스텁: 클릭 시 선택된 것으로 표시) ----------
  const locationBtn = document.getElementById('location-btn');
  let locationSelected = false;
  locationBtn.addEventListener('click', () => {
    locationSelected = true;
    document.getElementById('location-label').textContent = '서울 마포구 어울길 12-3 (선택됨)';
    locationBtn.classList.remove('text-muted2');
    locationBtn.classList.add('text-ink', 'border-primary');
    updateSubmitState();
  });

  // ---------- 사진 첨부: 최대 5장까지 목업 썸네일 추가 ----------
  const photoRow = document.getElementById('photo-row');
  const addPhotoBtn = document.getElementById('add-photo-btn');
  const photoCount = document.getElementById('photo-count');
  let photoNum = 0;
  addPhotoBtn.addEventListener('click', () => {
    if (photoNum >= 5) return;
    photoNum += 1;
    const thumb = document.createElement('div');
    thumb.className = 'shrink-0 w-20 h-20 rounded-xl bg-neutral-200';
    photoRow.insertBefore(thumb, addPhotoBtn);
    photoCount.textContent = `${photoNum}/5`;
    if (photoNum >= 5) addPhotoBtn.classList.add('hidden');
  });

  // ---------- 필수값 충족 시에만 제보 완료 버튼 활성화 ----------
  // 버튼은 비활성 상태를 유지하되(누르면 그냥 죽어있는 것처럼 보이는 것을 막기 위해),
  // 아직 채워지지 않은 필수 항목을 실시간으로 안내해 왜 눌리지 않는지 알 수 있게 한다.
  const nameInput = document.getElementById('name-input');
  const hoursInput = document.getElementById('hours-input');
  const submitBtn = document.getElementById('submit-btn');
  const submitHint = document.getElementById('submit-hint');
  let reportInteracted = false;

  function updateSubmitState() {
    reportInteracted = true;
    const categorySelected = categoryButtons.some(b => b.getAttribute('aria-pressed') === 'true');
    const missing = [];
    if (nameInput.value.trim().length === 0) missing.push('상호명');
    if (!locationSelected) missing.push('위치');
    if (!categorySelected) missing.push('카테고리');
    if (hoursInput.value.trim().length === 0) missing.push('영업시간');

    const enabled = missing.length === 0;
    submitBtn.disabled = !enabled;
    submitBtn.classList.toggle('bg-primary', enabled);
    submitBtn.classList.toggle('bg-navborder', !enabled);
    submitHint.textContent = `${missing.join(', ')}을(를) 입력해주세요`;
    submitHint.classList.toggle('hidden', enabled || !reportInteracted);
  }
  [nameInput, hoursInput].forEach(el => el.addEventListener('input', updateSubmitState));

  // ---------- 중복 등록 방지: 상호명이 기존 시드 데이터("국밥")와 유사하면 후보 모달로 안내 ----------
  // 실제로는 서버의 POST /api/restaurants/check-duplicate 응답(duplicateSuspected)에 따라 분기한다.
  const duplicateModal = document.getElementById('duplicate-modal');
  function openDuplicateModal() {
    duplicateModal.classList.remove('hidden');
    duplicateModal.classList.add('flex');
  }
  function closeDuplicateModal() {
    duplicateModal.classList.add('hidden');
    duplicateModal.classList.remove('flex');
  }
  document.getElementById('duplicate-backdrop').addEventListener('click', closeDuplicateModal);
  document.getElementById('duplicate-close').addEventListener('click', closeDuplicateModal);
  document.getElementById('duplicate-edit').addEventListener('click', () => {
    closeDuplicateModal();
    nameInput.focus();
  });
  document.getElementById('duplicate-proceed').addEventListener('click', () => {
    window.location.href = 'index.html';
  });

  submitBtn.addEventListener('click', () => {
    if (submitBtn.disabled) return;
    const duplicateSuspected = nameInput.value.includes('국밥');
    if (duplicateSuspected) {
      openDuplicateModal();
      return;
    }
    window.location.href = 'index.html';
  });
</script>
</body>
</html>
