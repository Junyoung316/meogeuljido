services:
  postgres:
    image: imresamu/postgis:16-3.6-bookworm
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 개발환경(WSL2/macOS)에서만 Tailscale 인터페이스 IP로 바인딩해 DB Tool 접속을 허용한다.
    # 운영 서버에서는 이 ports 매핑 자체를 제거하고 완전히 내부망으로만 둔다. (infra-design.md §2.2)
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 300 10
    volumes:
      - redis_data:/data
    # 로컬 개발 한정: 백엔드를 아직 컨테이너가 아니라 호스트에서 직접(gradle/IDE) 구동하므로
    # localhost로 접속 가능해야 한다. backend가 컨테이너화되면(infra-design.md §2.2) 이 매핑은 제거한다.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
