services:
  nginx:
    build: ./infra/nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - images_data:/usr/share/nginx/uploads:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./server/meogeuljido
    env_file: .env
    volumes:
      - images_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: imresamu/postgis:16-3.6-bookworm@sha256:74377ef202667cf7ec0d3e03699e43f037f1773323fc6a60445041eb821ffa10
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 개발환경(WSL2/macOS)에서만 Tailscale 인터페이스 IP로 바인딩해 DB Tool 접속을 허용한다.
    # 운영 서버에서는 이 ports 매핑 자체를 제거하고 완전히 내부망으로만 둔다. (infra-design.md §2.2)
    ports:
      - "${TAILSCALE_IP:-127.0.0.1}:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 300 10
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot

volumes:
  postgres_data:
  redis_data:
  images_data:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${NAS_USERNAME},password=${NAS_PASSWORD},vers=3.0,uid=1000,gid=1000"
      device: "//${NAS_IP}/${NAS_SHARE_PATH}"
  certbot_conf:
  certbot_www:
