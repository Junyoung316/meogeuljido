name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: 'npm', cache-dependency-path: front/meogeuljido/package-lock.json }
      - working-directory: front/meogeuljido
        run: |
          npm ci
          npm run build

  build-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: ${{ vars.POSTGIS_IMAGE }}
        env:
          POSTGRES_USER: meogeuljido
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: meogeuljido
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_USER: meogeuljido
      POSTGRES_PASSWORD: ci_test_password
      POSTGRES_DB: meogeuljido
      REDIS_PASSWORD: ""
      JWT_SECRET: ci_test_jwt_secret_key_do_not_use_in_production_min_32_bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: 'gradle' }
      - working-directory: server/meogeuljido
        run: ./gradlew build
