# infra/nginx/conf.d/meogeuljido.conf

server {
    listen 80;
    server_name meogeuljido.example.com;

    # Let's Encrypt HTTP-01 challenge 응답용
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name meogeuljido.example.com;

    ssl_certificate     /etc/letsencrypt/live/meogeuljido.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meogeuljido.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Vue 정적 빌드 산출물 (SPA 라우팅 대응)
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/_common.locations.conf;

    # 정적 자산 캐싱
    location ~* \.(js|css|png|jpg|jpeg|webp|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 이미지 정적 서빙 (백엔드가 로컬 볼륨에 저장한 파일)
    location /uploads/ {
        alias /usr/share/nginx/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

}
